name: Build (Linux + Windows + macOS + Android + Browser)

on:
  workflow_dispatch:

# Necessário para criar/atualizar o release e enviar os assets.
permissions:
  contents: write

# Todos os jobs são independentes (sem "needs"): se um falhar, os outros
# continuam e publicam seus assets no mesmo release rolante "latest".

jobs:
  # ---------------------------------------------------------------------------
  # 1) Linux: backend Go + client C++
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (backend + client)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go backend (linux)
        run: |
          cd mods/megabrain/engine
          GOOS=linux GOARCH=amd64 go build -o megabrain-engine .

      - name: Setup vcpkg cache
        uses: actions/cache@v3
        with:
          path: |
            ~/vcpkg
            ~/vcpkg_installed
            ~/vcpkg-manifest
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Build client (linux)
        run: make build-ubuntu

      - name: Package (linux)
        run: cd build/dist && zip -r ../../otclient-linux.zip .

      - name: Publish asset (linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest build" \
              --notes "Build automatico do cliente (branch main)." || true
          gh release upload latest otclient-linux.zip --clobber

  # ---------------------------------------------------------------------------
  # 2) Windows: backend Go + client C++
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows (backend + client)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go backend (windows)
        shell: bash
        run: |
          cd mods/megabrain/engine
          GOOS=windows GOARCH=amd64 go build -o megabrain-engine.exe .

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitURL: "https://github.com/microsoft/vcpkg.git"
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Build client (windows)
        uses: lukka/run-cmake@v10
        with:
          configurePreset: windows-release
          buildPreset: windows-release
          configurePresetAdditionalArgs: "['-DTOGGLE_BIN_FOLDER=ON', '-DOPTIONS_ENABLE_IPO=OFF', '-DOTCLIENT_BUILD_TESTS=OFF']"

      - name: Package (windows)
        shell: bash
        run: |
          mkdir -p dist
          cp build/windows-release/bin/*.exe dist/ 2>/dev/null || true
          cp -r data mods modules init.lua otclientrc.lua dist/ 2>/dev/null || true
          [ -f cacert.pem ] && cp cacert.pem dist/ || true

      - name: Zip (windows)
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath otclient-windows.zip -Force

      - name: Publish asset (windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest build" \
              --notes "Build automatico do cliente (branch main)." || true
          gh release upload latest otclient-windows.zip --clobber

  # ---------------------------------------------------------------------------
  # 3) macOS: client C++ (Apple Silicon / arm64)
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS (arm64)
    runs-on: macos-15
    if: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read vcpkg baseline
        id: vcpkg
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_PYTHON3: ${{ steps.python.outputs.python-path }}
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg.outputs.baseline }}
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@v4.3.4

      - name: Configure and build (macos)
        run: |
          cmake --preset macos-release -DTOGGLE_BIN_FOLDER=ON
          cmake --build --preset macos-release --target otclient

      # Os assets entram em Contents/MacOS/ porque o work dir do client é
      # descoberto a partir do diretório do binário (PHYSFS_getBaseDir), que
      # dentro do bundle é exatamente Contents/MacOS/.
      - name: Bundle assets and sign (macos)
        run: |
          APP="build/macos-release/bin/OTClient.app"
          cp -r data mods modules init.lua otclientrc.lua cacert.pem "$APP/Contents/MacOS/" 2>/dev/null || true
          [ -f config.ini ] && cp config.ini "$APP/Contents/MacOS/" || true
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"

      - name: Package (macos)
        run: ditto -c -k --keepParent build/macos-release/bin/OTClient.app otclient-macos.zip

      - name: Publish asset (macos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest build" \
              --notes "Build automatico do cliente (branch main)." || true
          gh release upload latest otclient-macos.zip --clobber

  # ---------------------------------------------------------------------------
  # 4) Android: APK (arm64-v8a)
  # ---------------------------------------------------------------------------
  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      NDK_VERSION: "29.0.13599879"
      CMAKE_VERSION: "3.22.1"
      COMPILE_SDK: "36"
      BUILD_TOOLS_VERSION: "36.0.0"
      CI_ANDROID_ABIS: "arm64-v8a"
      LUAJIT_COMMIT: "d0e88930ddde28ff662503f9f20facf34f7265aa"
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_FEATURE_FLAGS: versions,binarycaching

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      # setup-android@v3 instala "tools platform-tools" por padrão, mas o
      # pacote legado "tools" não existe mais e faz o sdkmanager sair com erro.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install host build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            g++-multilib \
            gcc-multilib \
            git \
            make \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            zip

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error title=Missing Android SDK::ANDROID_SDK_ROOT or ANDROID_HOME must be set."
            exit 1
          fi

          sdkmanager --sdk_root="$sdk_root" --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          ndk_dir="$sdk_root/ndk/${NDK_VERSION}"
          if [[ ! -d "$ndk_dir" ]]; then
            ndk_dir="$(find "$sdk_root/ndk" -maxdepth 1 -type d -name "${NDK_VERSION}*" | sort | head -n 1)"
          fi
          if [[ -z "$ndk_dir" || ! -d "$ndk_dir" ]]; then
            echo "::error title=Missing Android NDK::NDK ${NDK_VERSION} was not installed."
            exit 1
          fi

          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$ndk_dir"
            echo "ANDROID_NDK_ROOT=$ndk_dir"
          } >> "$GITHUB_ENV"

      - name: Read vcpkg baseline
        id: vcpkg
        run: |
          set -euo pipefail
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid vcpkg baseline::vcpkg.json must contain a full 40-character builtin-baseline SHA."
            exit 1
          fi
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg checkout
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.baseline }}

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [[ ! -d "${VCPKG_ROOT}/.git" ]]; then
            git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          fi
          git -C "${VCPKG_ROOT}" fetch --depth 1 origin "${{ steps.vcpkg.outputs.baseline }}"
          git -C "${VCPKG_ROOT}" checkout "${{ steps.vcpkg.outputs.baseline }}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Export vcpkg GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      - name: Cache LuaJIT Android libraries
        id: luajit-cache
        uses: actions/cache@v4
        with:
          path: |
            luajit-src
            android/app/libs
          key: luajit-android-${{ runner.os }}-${{ env.CI_ANDROID_ABIS }}-ndk-${{ env.NDK_VERSION }}-${{ env.LUAJIT_COMMIT }}-${{ hashFiles('build_luajit_android.sh') }}

      - name: Fetch LuaJIT source
        if: steps.luajit-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://github.com/LuaJIT/LuaJIT.git luajit-src
          git -C luajit-src checkout "${LUAJIT_COMMIT}"

      - name: Build LuaJIT for Android
        if: steps.luajit-cache.outputs.cache-hit != 'true'
        env:
          OTCLIENT_ANDROID_ABIS: ${{ env.CI_ANDROID_ABIS }}
        run: |
          set -euo pipefail
          chmod +x build_luajit_android.sh
          ./build_luajit_android.sh

      - name: Pack game assets into data.zip
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          output = Path('android/app/src/main/assets/data.zip')
          roots = [Path('data'), Path('mods'), Path('modules')]
          files = [Path('init.lua'), Path('otclientrc.lua'), Path('cacert.pem'), Path('config.ini')]

          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in roots:
                  if not root.exists():
                      raise SystemExit(f'Missing asset directory: {root}')
                  for path in sorted(root.rglob('*')):
                      if path.is_file():
                          archive.write(path, path.as_posix())
              for path in files:
                  if path.exists():
                      archive.write(path, path.as_posix())

          print(f'Wrote {output} ({output.stat().st_size} bytes)')
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          OTCLIENT_ANDROID_ABIS: ${{ env.CI_ANDROID_ABIS }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Publish asset (android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest build" \
              --notes "Build automatico do cliente (branch main)." || true
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -n1)" otclient-android.apk
          gh release upload latest otclient-android.apk --clobber

  # ---------------------------------------------------------------------------
  # 5) Browser: WebAssembly + HTML5 / PWA Bundle
  # ---------------------------------------------------------------------------
  build-browser:
    name: Browser (WASM / Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build browser bundle with Docker
        run: |
          chmod +x Dockerfile.browser.sh
          ./Dockerfile.browser.sh

      - name: Package PWA files and bundle
        run: |
          OUTPUT_DIR="build-emscripten-web"
          # Inclui os arquivos do PWA (manifest, service worker e icones) no pacote web
          cp browser/manifest.json "$OUTPUT_DIR/" 2>/dev/null || true
          cp browser/sw.js "$OUTPUT_DIR/" 2>/dev/null || true
          cp browser/icon-*.png "$OUTPUT_DIR/" 2>/dev/null || true
          cd "$OUTPUT_DIR" && zip -r ../otclient-browser.zip .

      - name: Publish asset (browser)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest build" \
              --notes "Build automatico do cliente (branch main)." || true
          gh release upload latest otclient-browser.zip --clobber
